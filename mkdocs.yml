site_name: Demonstrator Docs


theme:
  name: "material"

features:
  - navigation.expand

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

nav:
  - Overview: index.md
  - Setup Guide: setup.md
  - Usage Guide: user_guide.md
  - Augmentation Guide: augmentation.md
  - Training Guide: training.md